# Pages CMS ayarları — bu dosyayı değiştirmene gerek yok.
media:
  input: images
  output: /images
  rename: safe

content:
  - name: projeler
    label: Projeler / Galeriler
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Proje adı
        type: string
        required: true
      - name: slug
        label: Sayfa adresi (boş bırakabilirsin, proje adından otomatik oluşur)
        type: string
      - name: subtitle
        label: Alt başlık (yer / tarih)
        type: string
      - name: cover
        label: Kapak fotoğrafı
        type: image
      - name: photos
        label: Fotoğraflar
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. fotoğraf {caption}"
        fields:
          - name: image
            label: Fotoğraf
            type: image
          - name: caption
            label: Açıklama (isteğe bağlı)
            type: string

  - name: ayarlar
    label: Site Ayarları
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: name, label: Adın (logo yazısı), type: string }
      - { name: fullname, label: Ana sayfa başlığı (ör. SeDaT ÖCaLaN), type: string }
      - { name: tagline, label: Ana sayfa kısa tanıtım, type: string }
      - { name: about, label: İletişim sayfası metni, type: text }
      - { name: email, label: E-posta, type: string }
      - { name: instagram, label: Instagram adresi, type: string }
      - { name: px500, label: 500px adresi, type: string }
      - { name: footer, label: Alt bilgi yazısı, type: string }
      - { name: other_label, label: Diğer site bağlantısının adı (ör. Other Works), type: string }
      - { name: other_url, label: Diğer sitenin adresi (boş bırakırsan menüde görünmez), type: string }
